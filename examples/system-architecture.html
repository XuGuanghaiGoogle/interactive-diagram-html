<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル提供基盤 · 構成図（サンプル）</title>
<style>
  :root{ --bg:#f4f6fa; --card:#ffffff; --ink:#1b2330; --muted:#5c6675; --line:#d8dee8; --panel:420px; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Yu Gothic UI","Hiragino Sans","Meiryo","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;}
  .wrap{max-width:1800px;margin:0 auto;padding:24px 20px 60px;transition:padding-right .25s ease}
  body.open .wrap{padding-right:calc(var(--panel) + 24px)}
  header h1{font-size:22px;margin:0 0 6px}
  header p{margin:0 0 10px;color:var(--muted);font-size:13px;line-height:1.75}
  .legend{display:flex;flex-wrap:wrap;gap:13px;margin:0 0 8px;font-size:12px;color:var(--muted);align-items:center}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1.5px solid}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
  .tagchip{display:inline-block;background:#ffe6cc;border:1px solid #d79b00;color:#8a5a00;
           border-radius:4px;padding:0 5px;font-size:10.5px;margin-right:4px;font-weight:700}
  .hint{font-size:12px;color:#2e7d32;background:#e8f5e9;border:1px solid #c7e6c9;border-radius:8px;
        padding:7px 12px;display:inline-block;margin:4px 0 12px}
  .tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px}
  .tools button{border:1px solid var(--line);background:#fff;color:#33404f;border-radius:8px;
                padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .tools button:hover{background:#f1f4f9}
  .tools button.pri{border-color:#82b366;color:#2e7d32;background:#f2fbf3;font-weight:700}
  .tools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .tools .tip{font-size:11.5px;color:var(--muted);margin-left:auto}
  .board{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;
         box-shadow:0 2px 10px rgba(20,30,60,.06);height:clamp(460px,74vh,980px);position:relative}
  #chart{display:block;margin:0 auto;touch-action:none;cursor:grab;
      -webkit-user-select:none;user-select:none;background:#fff}
  #chart.grabbing{cursor:grabbing}
  .tools button[disabled]{opacity:.45;cursor:default}
  .tools button.edit-on{border-color:#2563eb;color:#1d4ed8;background:#eff6ff;font-weight:700}
  .tools .status{font-size:12px;color:#1d4ed8}
  .tools .status.err{color:#c62828}
  body.editing .board{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.18)}
  body.editing .ng{cursor:move}
  .ng .pt{opacity:0;cursor:crosshair;transition:opacity .12s}
  body.editing .ng:hover .pt{opacity:1}
  .ng .pt:hover{fill:#2563eb}
  .ng .rs{opacity:0;cursor:ew-resize;transition:opacity .12s}
  body.editing .ng:hover .rs{opacity:.85}
  .ehit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;pointer-events:stroke}
  .nd{cursor:pointer}
  .nd .shp{transition:filter .15s ease}
  .nd:hover .shp{filter:brightness(.96) drop-shadow(0 2px 4px rgba(0,0,0,.18))}
  .nd.sel .shp{stroke-width:3.2;filter:drop-shadow(0 0 6px rgba(46,125,50,.5))}
  .mx{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;overflow:auto}
  .mx h3{margin:0 0 4px;font-size:14px}
  .mx .cap{font-size:12px;color:var(--muted);margin:0 0 12px}
  .mx table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:760px}
  .mx th,.mx td{border-bottom:1px solid #eef1f6;padding:7px 10px;text-align:left;vertical-align:top}
  .mx th{font-size:11px;color:var(--muted);font-weight:700;background:#f7f9fc}
  .mx td.c,.mx th.c{text-align:center}
  .mx tbody tr[data-go]{cursor:pointer}
  .mx tbody tr[data-go]:hover{background:#f2f8ff}
  .mx td.svc{font-weight:700;color:#243043}
  .mx tr.grp td{background:#eef3f9;font-weight:700;color:#3d4a5c}
  .notes{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
  .note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
  .note.wide{grid-column:1/-1}
  .note h3{margin:0 0 8px;font-size:14px}
  .note ul,.note ol{margin:0;padding-left:18px;font-size:12.5px;line-height:1.9;color:#3b4453}
  .stats{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 14px}
  .stats h3{margin:0 0 4px;font-size:14px}
  .stats .cap{font-size:12px;color:var(--muted);margin:0 0 6px}
  .stats .chartbox{position:relative;max-width:820px}
  .stats svg{display:block;width:100%;height:auto}
  .stats .ctip{position:absolute;pointer-events:none;background:#1b2330;color:#fff;font-size:12px;line-height:1.7;border-radius:6px;padding:6px 10px;white-space:nowrap;z-index:5}
  code{background:#eef1f6;border-radius:4px;padding:1px 5px;font-size:12px}

  #panel{position:fixed;top:0;right:0;width:var(--panel);height:100vh;background:#fff;
         border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(20,30,60,.10);
         transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
  body.open #panel{transform:translateX(0)}
  #panel .ph{padding:18px 22px 12px;border-bottom:1px solid var(--line);position:relative}
  #panel .pb{padding:12px 22px 40px;overflow:auto}
  #panel h2{margin:6px 0 4px;font-size:17px;line-height:1.4;padding-right:30px}
  #panel .sub{font-size:12px;color:var(--muted)}
  #panel .badge{display:inline-block;font-size:11px;border-radius:20px;padding:2px 10px;border:1px solid;font-weight:700}
  #panel h4{margin:16px 0 6px;font-size:12px;color:#2e7d32;letter-spacing:.06em}
  #panel p{margin:0;font-size:13px;line-height:1.9;color:#33404f}
  #panel ul{margin:0;padding-left:18px;font-size:13px;line-height:1.95;color:#33404f}
  #panel .io{background:#f6f8fc;border:1px solid #e3e8f0;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.9;color:#3b4453}
  #panel .kv{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
  #panel .kv th{width:34%;text-align:left;color:var(--muted);font-weight:400;padding:4px 6px;border-bottom:1px solid #eef1f6;vertical-align:top}
  #panel .kv td{padding:4px 6px;border-bottom:1px solid #eef1f6;color:#243043}
  #panel .chips{display:flex;flex-wrap:wrap;gap:6px}
  #panel .chip{border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;cursor:pointer;background:#fff;color:#33404f}
  #panel .chip:hover{background:#f1f4f9}
  #close{position:absolute;top:14px;right:16px;border:1px solid var(--line);background:#fff;
         width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:#5c6675;line-height:1}
  #close:hover{background:#f1f4f9}
  @media(max-width:860px){ :root{--panel:100vw} body.open .wrap{padding-right:20px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <p id="lead"></p>
    <div class="legend" id="catlegend"></div>
    <div class="legend" id="phaselegend"></div>
    <div class="legend" id="extralegend"></div>
    <div class="hint" id="hint"></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tools" id="tools"></div>
  <div class="tools" id="edittools"></div>
  <div class="board"><svg id="chart" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="tables"></div>
  <div class="notes" id="notes"></div>
</div>

<aside id="panel" aria-live="polite">
  <div class="ph">
    <span class="badge" id="p-badge"></span>
    <button id="close">✕</button>
    <h2 id="p-title"></h2>
    <div class="sub" id="p-sub"></div>
  </div>
  <div class="pb" id="p-body"></div>
</aside>

function port(ref){
  const a=ref.split(':'),n=N[a[0]],s=a[1]||'r';
  if(!n)return null;
  if(s==='l')return{x:n.x,y:n.cy};

  if(s==='t')return{x:n.cx,y:n.y};
  return{x:n.cx,y:n.y+n.h};
}
function nodeOf(id){return N[id];}
/* ROUTE-BEGIN：由 scripts/sync-route.mjs 从 scripts/route-block.js 注入 engine.html 与 build.mjs，两处必须一致，勿直接改 */
/* 直角走线：始终从起点端口的外侧出发、从终点端口的外侧进入，不改用户选的端口。
   手写 via / mx / my 优先；否则在候选路线中选不穿过两端方块、拐点最少、最短的一条。 */
function route(e){
  const G=20;
  const ia=String(e.from).split(':'),ib=String(e.to).split(':');
  const sa=ia[1]||'r',sb=ib[1]||'l';
  let p1=port(e.from),p2=port(e.to);if(!p1||!p2)return null;
  if(e.d1)p1={x:p1.x+(e.d1[0]||0),y:p1.y+(e.d1[1]||0)};
  if(e.d2)p2={x:p2.x+(e.d2[0]||0),y:p2.y+(e.d2[1]||0)};
  if(e.via)return[p1].concat(e.via.map(function(v){return{x:v[0],y:v[1]};})).concat([p2]);
  if(e.mx!=null)return[p1,{x:e.mx,y:p1.y},{x:e.mx,y:p2.y},p2];
  if(e.my!=null)return[p1,{x:p1.x,y:e.my},{x:p2.x,y:e.my},p2];
  const na=nodeOf(ia[0]),nb=nodeOf(ib[0]);
  /* 外伸段默认 G；若正前方紧挨着另一端的方块，缩短到空隙的一半，避免伸进对方 */
  function out(p,s,other){let d=G;
    if(other){
      if((s==='b'||s==='t')&&p.x>other.x&&p.x<other.x+other.w){const gap=s==='b'?other.y-p.y:p.y-(other.y+other.h);if(gap>=0&&gap<2*G)d=Math.max(1,gap/2);}
      if((s==='r'||s==='l')&&p.y>other.y&&p.y<other.y+other.h){const gap=s==='r'?other.x-p.x:p.x-(other.x+other.w);if(gap>=0&&gap<2*G)d=Math.max(1,gap/2);}
    }
    return{x:p.x+(s==='r'?d:s==='l'?-d:0),y:p.y+(s==='b'?d:s==='t'?-d:0)};}
  const o=out(p1,sa,nb),q=out(p2,sb,na);
  const boxes=[na,nb].filter(Boolean);
  const L=Math.min.apply(null,boxes.map(function(b){return b.x;}).concat([o.x,q.x]))-G;
  const R=Math.max.apply(null,boxes.map(function(b){return b.x+b.w;}).concat([o.x,q.x]))+G;
  const T=Math.min.apply(null,boxes.map(function(b){return b.y;}).concat([o.y,q.y]))-G;
  const B=Math.max.apply(null,boxes.map(function(b){return b.y+b.h;}).concat([o.y,q.y]))+G;
  const mx=(o.x+q.x)/2,my=(o.y+q.y)/2;
  /* 同为 4 点时先出现的优先：中线折线在前，保持 mx / my 默认取中点的旧行为 */
  const mids=[
    [{x:mx,y:o.y},{x:mx,y:q.y}],[{x:o.x,y:my},{x:q.x,y:my}],
    [{x:q.x,y:o.y}],[{x:o.x,y:q.y}],
    [{x:R,y:o.y},{x:R,y:q.y}],[{x:L,y:o.y},{x:L,y:q.y}],
    [{x:o.x,y:B},{x:q.x,y:B}],[{x:o.x,y:T},{x:q.x,y:T}]
  ];
  function simplify(pts){
    const a=[];pts.forEach(function(p){const l=a[a.length-1];if(!l||l.x!==p.x||l.y!==p.y)a.push(p);});
    for(let i=a.length-2;i>0;i--){const u=a[i-1],v=a[i],w=a[i+1];
      if((u.x===v.x&&v.x===w.x)||(u.y===v.y&&v.y===w.y))a.splice(i,1);}
    return a;
  }
  function hits(u,v,b){
    const x0=b.x+1,x1=b.x+b.w-1,y0=b.y+1,y1=b.y+b.h-1;
    if(u.y===v.y)return u.y>y0&&u.y<y1&&Math.max(u.x,v.x)>x0&&Math.min(u.x,v.x)<x1;
    return u.x>x0&&u.x<x1&&Math.max(u.y,v.y)>y0&&Math.min(u.y,v.y)<y1;
  }
  function ok(pts){
    for(let i=0;i<pts.length-1;i++){const u=pts[i],v=pts[i+1];
      if(u.x!==v.x&&u.y!==v.y)return false;
      for(let k=0;k<boxes.length;k++)if(hits(u,v,boxes[k]))return false;}
    /* 离开起点、进入终点的方向必须与端口朝向一致 */
    const s1=pts[1],s2=pts[pts.length-2];
    const dirOk=function(p,n,s){return s==='r'?n.x>p.x:s==='l'?n.x<p.x:s==='b'?n.y>p.y:n.y<p.y;};
    return dirOk(p1,s1,sa)&&dirOk(p2,s2,sb);
  }
  function len(pts){let s=0;for(let i=0;i<pts.length-1;i++)s+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y);return s;}
  let best=null;
  mids.forEach(function(m){
    const pts=simplify([p1,o].concat(m,[q,p2]));
    if(pts.length<2||!ok(pts))return;
    if(!best||pts.length<best.length||(pts.length===best.length&&len(pts)<len(best)))best=pts;
  });
  return best||simplify([p1,o,{x:R,y:o.y},{x:R,y:q.y},q,p2]);
}

  const selE=ED.on&&ED.sel===idx;

/* ---------- phase stats (derived from node positions & panel data) ---------- */
function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').trim();}
function phaseLevels(){return (PH&&PH.levels)||[];}
function phaseCol(n){const T=DATA.timeline;return T?Math.floor((n.x+n.w/2-T.x0)/T.colW):-1;}
/* 方块所在的时间轴列决定它属于第几期（拖动后自动更新） */
function prettyKey(k){return String(k).replace(/^第\s*(\d+)\s*期$/,'第 $1 期');}

  if(!PH||!PH.byColumn||!DATA.timeline||!n.phase)return;
  const lv=phaseLevels()[phaseCol(n)];if(!lv||lv.key===n.phase.level)return;
  const old=n.phase.level;n.phase.level=lv.key;
  /* 副标题原本就是期名时才跟着改，避免覆盖自定义副标题 */
  if(n.s===old||n.s===prettyKey(old))n.s=prettyKey(lv.key);
}
function periodOf(i){const T=DATA.timeline,lv=phaseLevels()[i];if(!T||!T.labels[i])return '';
  return String(T.labels[i]).replace(lv?lv.key:'','').trim();}
function screensOf(n){
  const out=[],re=/<tr><td[^>]*>([\s\S]*?)<\/td><td[^>]*>([\s\S]*?)<\/td>/g;let m;
  const mark=(DATA.stats&&DATA.stats.newMark)||L.newMark;
  while((m=re.exec(n.io||''))){const nm=strip(m[2]),isNew=nm.indexOf(mark)>=0;
    out.push({side:strip(m[1]),name:isNew?nm.replace(new RegExp('[（(]?\\s*'+mark.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[）)]?$'),'').trim():nm,isNew:isNew});}
  return out;
}
function effortOf(n){const key=(DATA.stats&&DATA.stats.effortKey)||L.effortKey;const r=(n.kv||[]).find(function(k){return k[0]===key;});const m=r&&String(r[1]).match(/([\d.]+)/);return m?parseFloat(m[1]):0;}
function nodesOfLevel(key){
  return (DATA.nodes||[]).filter(function(n){return n.phase&&n.phase.level===key;})
    .sort(function(a,b){return a.y-b.y||a.x-b.x;});
}
function phaseStats(){
  return phaseLevels().map(function(lv,i){
    const ns=nodesOfLevel(lv.key),seen={};let screens=0,fresh=0,effort=0;
    ns.forEach(function(n){effort+=effortOf(n);screensOf(n).forEach(function(s){const k=s.side+'|'+s.name;if(seen[k])return;seen[k]=1;screens++;if(s.isNew)fresh++;});});
    return {lv:lv,i:i,nodes:ns,screens:screens,fresh:fresh,effort:Math.round(effort*10)/10,period:periodOf(i)};
  });
}
function fmtNum(v){return (Math.round(v*10)/10).toString();}

/* ---------- workload chart ---------- */
const statsWrap=$('stats');
function renderStats(){
  if(!statsWrap)return;
  if(!DATA.stats||!PH){statsWrap.remove();return;}
  const S=phaseStats(),W=760,H=250,pl=44,pr=16,pt=26,pb=48;
  const maxV=Math.max(1,Math.max.apply(null,S.map(function(s){return s.screens;})));
  const step=maxV<=10?2:maxV<=25?5:maxV<=60?10:20,top=Math.ceil(maxV/step)*step;
  const iw=W-pl-pr,ih=H-pt-pb,slot=iw/S.length,bwid=Math.min(56,slot*0.46);
  let g='';
  for(let v=0;v<=top;v+=step){const y=pt+ih-ih*v/top;
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="'+(v?'#eef1f6':'#c9d1dc')+'"/>'+
       '<text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#6b7585">'+v+'</text>';}
  S.forEach(function(s){
    const cx=pl+slot*(s.i+.5),h=ih*s.screens/top,x=cx-bwid/2,y=pt+ih-h,r=Math.min(4,h/2);
    const col=s.lv.color||'#2563eb';
    if(s.screens>0)g+='<path d="M'+x+','+(pt+ih)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+bwid-r)+' Q'+(x+bwid)+','+y+' '+(x+bwid)+','+(y+r)+' V'+(pt+ih)+' Z" fill="'+col+'"/>';
    g+='<text x="'+cx+'" y="'+(y-7)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2330">'+s.screens+'</text>';
    g+='<text x="'+cx+'" y="'+(pt+ih+17)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#33404f">'+esc(s.lv.key)+'</text>';
    g+='<text x="'+cx+'" y="'+(pt+ih+33)+'" text-anchor="middle" font-size="10.5" fill="#6b7585">'+esc(s.period)+'</text>';
    g+='<rect class="hit" data-i="'+s.i+'" x="'+(pl+slot*s.i)+'" y="'+pt+'" width="'+slot+'" height="'+ih+'" fill="transparent"/>';
  });
  statsWrap.innerHTML='<h3>'+esc(DATA.stats.title||'')+'</h3>'+(DATA.stats.caption?'<p class="cap">'+DATA.stats.caption+'</p>':'')+
    '<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(DATA.stats.title||'')+'">'+
    '<text x="'+pl+'" y="12" font-size="11" fill="#6b7585">'+esc((DATA.stats&&DATA.stats.yLabel)||L.chartY)+'</text>'+g+'</svg><div class="ctip" hidden></div></div>';
  const tipEl=statsWrap.querySelector('.ctip'),box=statsWrap.querySelector('.chartbox');
  statsWrap.querySelectorAll('.hit').forEach(function(rc){
    rc.addEventListener('mousemove',function(ev){const s=S[+rc.getAttribute('data-i')],br=box.getBoundingClientRect();
      tipEl.innerHTML='<b>'+esc(s.lv.key)+'</b>　'+esc(s.period)+'<br>'+esc(L.tipScreens)+'　<b>'+s.screens+'</b>（'+esc(L.tipNew)+' '+s.fresh+'）<br>'+esc(L.tipFeatures)+'　'+s.nodes.length+'<br>'+esc(L.tipEffort)+'　'+esc(fmt(L.effortFmt,fmtNum(s.effort)))+(s.lv.effort?'<br>'+esc(L.tipActual)+'　'+esc(s.lv.effort):'');
      tipEl.hidden=false;tipEl.style.left=Math.min(br.width-190,ev.clientX-br.left+14)+'px';tipEl.style.top=(ev.clientY-br.top+10)+'px';});
    rc.addEventListener('mouseleave',function(){tipEl.hidden=true;});
  });
}

/* ---------- tables ---------- */
const tbWrap=$('tables');
function rowClick(root){root.querySelectorAll('tr[data-go]').forEach(function(tr){tr.addEventListener('click',function(){
  const id=tr.getAttribute('data-go');if(!GEL[id]&&!N[id])return;if(GEL[id])open(id);centerOn(id);
  document.querySelector('.board').scrollIntoView({behavior:'smooth',block:'center'});});});}
function groupIds(g){return g.level?nodesOfLevel(g.level).map(function(n){return n.id;}):(g.ids||[]);}
function groupLabel(g){
  if(g.label)return g.label;const i=phaseLevels().findIndex(function(l){return l.key===g.level;});const lv=phaseLevels()[i];
  return lv?lv.key+'｜'+(lv.goal||'')+'（'+periodOf(i)+'）':'';
}
function renderTables(){
tbWrap.innerHTML='';
(DATA.tables||[]).forEach(function(tb){
  const box=document.createElement('div');box.className='mx';
  let h='<h3>'+esc(tb.title||'')+'</h3>'+(tb.caption?'<p class="cap">'+tb.caption+'</p>':'');
  if(tb.type==='phaseSummary'){
    const C=tb.columns||L.sumCols;
    h+='<table><thead><tr>'+C.map(function(c,i){return '<th'+(i>=3&&i<=5?' class="c"':'')+'>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
    phaseStats().forEach(function(s){
      const go=s.nodes[0]?' data-go="'+esc(s.nodes[0].id)+'"':'';
      h+='<tr'+go+'><td class="svc"><b style="color:'+(s.lv.color||'#333')+'">'+esc(s.lv.key)+'</b></td><td>'+esc(s.period)+'</td><td>'+esc(s.lv.goal||'')+'</td>'+
        '<td class="c">'+s.nodes.length+'</td><td class="c">'+s.screens+'（'+s.fresh+'）</td>'+
        '<td class="c">'+esc(s.lv.effort||'—')+' / '+esc(fmt(L.effortFmt,fmtNum(s.effort)))+'</td>'+
        '<td>'+(s.nodes.map(function(n){return esc(n.t||n.id);}).join('、')||'—')+'</td></tr>';
    });
    h+='</tbody></table>';
  }else if(tb.type==='phase'){
    h+='<table><thead><tr><th style="width:240px">'+esc(tb.columns?tb.columns[0]:L.component)+'</th><th style="width:90px">'+esc(tb.columns?tb.columns[1]:L.level)+'</th><th>'+esc(tb.columns?tb.columns[2]:L.detail)+'</th></tr></thead><tbody>';
    (tb.groups||[]).forEach(function(g){h+='<tr class="grp"><td colspan="3">'+esc(groupLabel(g))+'</td></tr>';
      groupIds(g).forEach(function(id){const n=INFO[id];if(!n||!n.phase)return;
        h+='<tr data-go="'+esc(id)+'"><td class="svc">'+esc(n.t||id)+'</td><td><b style="color:'+(PHC[n.phase.level]||'#333')+'">'+esc(n.phase.level)+'</b></td><td>'+(n.phase.text||'')+'</td></tr>';});});
    h+='</tbody></table>';
  }else if(tb.type==='uses'){
    const T=tb.targets||[];
    h+='<table><thead><tr><th>'+esc(tb.firstColumn||L.component)+'</th>'+T.map(function(k){return '<th class="c">'+esc((INFO[k]&&INFO[k].t)||k)+'</th>';}).join('')+'</tr></thead><tbody>';
    (tb.groups||[]).forEach(function(g){h+='<tr class="grp"><td colspan="'+(T.length+1)+'">'+esc(g.label)+'</td></tr>';
      g.ids.forEach(function(id){const n=INFO[id];if(!n)return;const u=USE[id]||[];
        h+='<tr data-go="'+esc(id)+'"><td>'+esc(n.t||id)+(n.s?'<span style="color:#8b95a3"> / '+esc(n.s)+'</span>':'')+'</td>'+
          T.map(function(k){return '<td class="c">'+(u.indexOf(k)>=0?'<span style="color:'+(DOT[k]||'#2e7d32')+';font-size:15px">●</span>':'<span style="color:#dfe4ec">–</span>')+'</td>';}).join('')+'</tr>';});});
    h+='</tbody></table>';
  }else{
    const C=tb.columns||[];
    h+='<table><thead><tr>'+C.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
    (tb.rows||[]).forEach(function(r){
      if(r.group){h+='<tr class="grp"><td colspan="'+C.length+'">'+esc(r.group)+'</td></tr>';return;}
      h+='<tr'+(r.go?' data-go="'+esc(r.go)+'"':'')+'>'+(r.cells||[]).map(function(c,i){return '<td'+(i===0?' class="svc"':'')+'>'+c+'</td>';}).join('')+'</tr>';});
    h+='</tbody></table>';
  }
  box.innerHTML=h;tbWrap.appendChild(box);rowClick(box);
});
}
renderStats();renderTables();

/* ---------- notes ---------- */
const nWrap=$('notes');
(DATA.notes||[]).forEach(function(nt){
  const d=document.createElement('div');d.className='note'+(nt.wide?' wide':'');
  const tag=nt.ordered?'ol':'ul';
  d.innerHTML='<h3>'+esc(nt.title||'')+'</h3><'+tag+'>'+(nt.items||[]).map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+tag+'>';
  nWrap.appendChild(d);
});
if(!(DATA.notes||[]).length)nWrap.remove();
})();
</script>
